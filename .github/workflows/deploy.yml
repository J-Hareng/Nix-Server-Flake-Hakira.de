name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check
      # Evaluate only (cheap, works for any architecture):
      - run: nix eval .#nixosConfigurations.myhost.config.system.build.toplevel.drvPath
      # Or do a real build if the server is x86_64:
      # - run: nix build .#nixosConfigurations.myhost.config.system.build.toplevel

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync flake to server
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            ./ admin@your.server.example:/home/admin/nix-config/

      - name: Switch with nh
        run: |
          ssh admin@your.server.example \
            'nh os switch /home/admin/nix-config -H myhost'
